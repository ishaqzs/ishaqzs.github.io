<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Random Quote Generator ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            font-family: 'Arial', sans-serif;
            color: #333;
            text-align: center;
            animation: backgroundPulse 5s infinite;
        }
        .quote-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }
        .quote {
            font-size: 1.5em;
            margin: 20px 0;
            font-style: italic;
            color: #555;
        }
        .author {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: bold;
        }
        button {
            padding: 15px 25px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #ff6f61;
            color: white;
            transition: background-color 0.3s, transform 0.3s;
        }
        button:hover {
            background-color: #ff4f3d;
            transform: scale(1.05);
        }
        @keyframes backgroundPulse {
            0%, 100% { background: linear-gradient(120deg, #f6d365 0%, #fda085 100%); }
            50% { background: linear-gradient(120deg, #fda085 0%, #f6d365 100%); }
        }
    </style>
</head>
<body>

<div class="quote-container">
    <h1>Random Quote Generator</h1>
    <p class="quote" id="quote">"The best way to predict the future is to create it."</p>
    <p class="author" id="author">- Peter Drucker</p>
    <button id="new-quote-button">Get Another Quote</button>
</div>

<script>
    const quotes = [
        { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
        { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
        { text: "Get busy living or get busy dying.", author: "Stephen King" },
        { text: "You only live once, but if you do it right, once is enough.", author: "Mae West" },
        { text: "In the end, we only regret the chances we didn't take.", author: "Lewis Carroll" }
    ];

    const quoteElement = document.getElementById('quote');
    const authorElement = document.getElementById('author');
    const button = document.getElementById('new-quote-button');

    button.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        quoteElement.textContent = quotes[randomIndex].text;
        authorElement.textContent = `- ${quotes[randomIndex].author}`;
    });
</script>

</body>
</html>
